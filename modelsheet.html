<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
<title>Model Sheet</title>
<style>
/* Charcoal Ink, same tokens as src/overlay.html and the chatpro-ops dashboard */
:root {
  --bg:#121212; --sidebar:#161616; --panel:#1a1a1a; --panel-2:#212121; --raise:#2a2a2a;
  --text:#ededed; --text-2:#cfcfcf; --muted:#8f8f8f;
  --accent:#f3f3f3; --accent-ink:#121212;
  --high:#ef6b5e; --high-bg:#2c1b19;
  --radius:6px; --font:'Inter','Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { color-scheme:dark; }
html,body { height:100%; font-family:var(--font); background:var(--bg); color:var(--text); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }

.titlebar { -webkit-app-region:drag; height:44px; background:var(--panel); display:flex; align-items:center; justify-content:space-between;
  padding:0 8px 0 12px; flex-shrink:0; }
.tb-left { display:flex; align-items:center; gap:9px; pointer-events:none; }
.brand-mark { width:24px; height:24px; border-radius:5px; background:var(--accent); color:var(--accent-ink); display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:12px; }
.tb-name { font-size:13px; font-weight:600; }
.tb-sub { font-size:12px; color:var(--muted); }
.tb-right { -webkit-app-region:no-drag; }
.tb-btn { background:none; border:none; color:var(--muted); cursor:pointer; width:30px; height:30px; border-radius:var(--radius);
  display:inline-flex; align-items:center; justify-content:center; transition:background .12s, color .12s; }
.tb-btn:hover { color:var(--high); background:var(--high-bg); }

.layout { display:flex; height:calc(100% - 44px); overflow:hidden; }

.sidebar { width:180px; flex-shrink:0; background:var(--sidebar); overflow-y:auto; padding:10px 8px; }
.section-btn { width:100%; text-align:left; background:none; border:none; border-radius:var(--radius); color:var(--text-2); font:inherit;
  font-size:13px; padding:7px 10px; cursor:pointer; margin-bottom:2px; transition:background .12s, color .12s; }
.section-btn:hover { background:var(--panel-2); color:var(--text); }
.section-btn.active { background:var(--raise); color:var(--text); font-weight:600; }

.content { flex:1; overflow-y:auto; padding:22px 26px; }
.content::-webkit-scrollbar { width:6px; }
.content::-webkit-scrollbar-thumb { background:var(--raise); border-radius:3px; }

.section-header { margin-bottom:14px; }
.section-title { font-size:18px; font-weight:600; letter-spacing:-0.01em; }

/* Key/value rows: tone steps instead of lines */
.kv-table { width:100%; border-collapse:separate; border-spacing:0 2px; margin-bottom:16px; }
.kv-table td { padding:8px 12px; font-size:13px; vertical-align:top; background:var(--panel); }
.kv-table td:first-child { color:var(--muted); width:40%; border-radius:var(--radius) 0 0 var(--radius); }
.kv-table td:last-child { color:var(--text); border-radius:0 var(--radius) var(--radius) 0; }
.kv-table td[colspan] { border-radius:var(--radius); }
.kv-table tr:hover td { background:var(--panel-2); }

.free-text { font-size:14px; color:var(--text); line-height:1.7; white-space:pre-wrap; max-width:62ch; }

.callout { position:relative; background:var(--panel); border-radius:8px; padding:12px 14px 12px 17px; margin:0 0 14px; }
.callout::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--raise); }
.callout.red { background:var(--high-bg); }
.callout.red::before { background:var(--high); }
.callout-label { font-size:13px; font-weight:600; margin-bottom:3px; }
.callout.red .callout-label { color:var(--high); }
.callout p { font-size:13px; color:var(--text-2); margin:0; line-height:1.6; }

.empty { color:var(--muted); font-size:13px; padding:8px 0; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="tb-left">
    <span class="brand-mark">C</span>
    <span class="tb-name" id="tbName">Model Sheet</span>
    <span class="tb-sub" id="tbSub"></span>
  </div>
  <div class="tb-right">
    <button class="tb-btn" onclick="window.chatpro.closeModelSheet()" title="Close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<script>
const SECTIONS = [
  { key: 'general',     label: 'General info' },
  { key: 'background',  label: 'Background' },
  { key: 'favorites',   label: 'Favorites' },
  { key: 'personality', label: 'Personality' },
  { key: 'cosplay',     label: 'Cosplay' },
  { key: 'content',     label: 'Content info' },
];

let activeSection = 0;
let sheetData = {};
let profileName = '';

function init() {
  try {
    var raw = localStorage.getItem('modelSheetData');
    if (raw) {
      var parsed = JSON.parse(raw);
      sheetData = parsed.sheet_data || {};
      profileName = parsed.name || 'Model Sheet';
      document.getElementById('tbName').textContent = profileName;
      document.getElementById('tbSub').textContent = parsed.age ? parsed.age + ' years' : '';
    }
  } catch(e) {}
  render();
}

function render() {
  // Sidebar
  document.getElementById('sidebar').innerHTML = SECTIONS.map((s, i) => `
    <button class="section-btn ${i === activeSection ? 'active' : ''}" onclick="showSection(${i})">${s.label}</button>
  `).join('');

  // Content
  var s = SECTIONS[activeSection];
  var data = sheetData[s.key] || '';
  var html = '<div class="section-header"><h1 class="section-title">' + s.label + '</h1></div>';

  if (!data) {
    html += '<div class="empty">No information entered for this section yet.</div>';
  } else {
    html += renderSection(s.key, data);
  }

  document.getElementById('content').innerHTML = html;
}

function renderSection(key, data) {
  if (key === 'background') {
    return '<div class="free-text">' + escHtml(data) + '</div>';
  }

  // Try to parse as key:value lines
  var lines = data.split('\n').filter(function(l) { return l.trim(); });
  var hasKV = lines.some(function(l) { return l.includes(':'); });

  if (hasKV) {
    var rows = lines.map(function(l) {
      var idx = l.indexOf(':');
      if (idx === -1) return '<tr><td colspan="2">' + escHtml(l) + '</td></tr>';
      var k = l.substring(0, idx).trim();
      var v = l.substring(idx + 1).trim();
      return '<tr><td>' + escHtml(k) + '</td><td>' + escHtml(v) + '</td></tr>';
    }).join('');
    var html = '<table class="kv-table">' + rows + '</table>';

    if (key === 'content') {
      html = '<div class="callout red"><div class="callout-label">Internal only, do not share</div><p>This information is for chatters only and must never be shared outside the team.</p></div>' + html;
    }
    return html;
  }

  return '<div class="free-text">' + escHtml(data) + '</div>';
}

function showSection(i) {
  activeSection = i;
  render();
  document.getElementById('content').scrollTop = 0;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
