<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>ChatPro live view</title>
<style>
/* Kleiner roter Punkt unten rechts: unaufdringlich, aber sichtbar solange die Live-Ansicht laeuft. */
html,body { margin:0; padding:0; background:transparent; overflow:hidden; user-select:none; -webkit-app-region:no-drag; }
#bar { box-sizing:border-box; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
#dot {
  width:14px; height:14px; border-radius:50%; background:#d91e18;
  box-shadow:0 0 0 2px rgba(255,255,255,.7), 0 1px 6px rgba(0,0,0,.5);
  animation:pulse 1.4s infinite;
}
@keyframes pulse { 50% { opacity:.35; } }
</style>
</head>
<body>
<div id="bar"><span id="dot" title="Live view active"></span></div>
<script>
(function () {
  var dot = document.getElementById('dot');
  if (window.liveBanner && window.liveBanner.onViewer) {
    window.liveBanner.onViewer(function (viewer) {
      // Name nur als Tooltip (textContent-frei), der Punkt bleibt klein.
      dot.title = viewer ? 'Live view active: ' + String(viewer).slice(0, 60) : 'Live view active';
    });
  }
})();
</script>
</body>
</html>
