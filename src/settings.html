<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
<title>ChatPro Settings</title>
<style>
/* Charcoal Ink, same tokens as overlay.html and the chatpro-ops dashboard */
:root {
  --bg:#121212; --panel:#1a1a1a; --panel-2:#212121; --raise:#2a2a2a;
  --text:#ededed; --text-2:#cfcfcf; --muted:#8f8f8f;
  --accent:#f3f3f3; --accent-ink:#121212; --accent-soft:#d0d0d0;
  --high:#ef6b5e; --high-bg:#2c1b19; --money:#4fc38a;
  --radius:6px; --font:'Inter','Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { color-scheme:dark; }
html,body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; height:100%;
  overflow-y:auto; -webkit-font-smoothing:antialiased; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.wrap { padding:16px 20px 24px; max-width:480px; }
.titlebar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; -webkit-app-region:drag; }
.title { display:flex; align-items:center; gap:9px; }
.brand-mark { width:24px; height:24px; border-radius:5px; background:var(--accent); color:var(--accent-ink); display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:12px; }
h1 { font-size:15px; font-weight:600; letter-spacing:-0.01em; }
.section { background:var(--panel); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
.section-title { font-size:13px; font-weight:600; margin-bottom:10px; }
.field-label { font-size:12px; color:var(--muted); margin-bottom:6px; }
.field-sub { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
.field-sub a { color:var(--text); }
.input { width:100%; background:var(--panel-2); border:1px solid var(--raise); border-radius:var(--radius); color:var(--text);
  font:inherit; font-size:13px; padding:8px 11px; outline:none; }
.input:focus { border-color:var(--accent-soft); }
.input::placeholder { color:var(--muted); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.toggle-row + .toggle-row { margin-top:10px; }
.toggle-label { font-size:13px; color:var(--text-2); }
.toggle { flex:none; width:36px; height:20px; border-radius:10px; background:var(--raise); cursor:pointer; position:relative; transition:background 0.2s; }
.toggle.on { background:var(--accent); }
.toggle::after { content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:var(--muted); top:3px; left:3px;
  transition:transform 0.2s, background 0.2s; }
.toggle.on::after { transform:translateX(16px); background:var(--accent-ink); }
.btn-save { width:100%; background:var(--accent); border:none; border-radius:var(--radius); color:var(--accent-ink); font:inherit; font-size:13px;
  font-weight:600; padding:11px; cursor:pointer; margin-top:6px; transition:background .12s, transform .12s; }
.btn-save:hover { background:#fff; }
.btn-save:active { transform:scale(.985); }
.save-msg { display:none; text-align:center; color:var(--money); font-size:12px; margin-top:8px; }
.version { font-size:12px; color:var(--muted); text-align:center; margin-top:14px; font-variant-numeric:tabular-nums; }
.btn-close-x { background:none; border:none; color:var(--muted); cursor:pointer; width:30px; height:30px; display:flex; align-items:center;
  justify-content:center; border-radius:var(--radius); transition:background .12s, color .12s; -webkit-app-region:no-drag; }
.btn-close-x:hover { background:var(--high-bg); color:var(--high); }
.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <div class="title"><span class="brand-mark">C</span><h1>Settings</h1></div>
    <button class="btn-close-x" onclick="window.chatpro.closeSettings()" title="Close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>

  <div class="section">
    <h2 class="section-title">Anthropic API key</h2>
    <div class="field">
      <input class="input" type="password" id="apiKey" placeholder="sk-ant-api03-…" aria-label="Anthropic API key" />
      <div class="field-sub">Get your key at <a href="#" onclick="window.chatpro.openUrl('https://console.anthropic.com')">console.anthropic.com</a></div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">DeepL API key</h2>
    <div class="field">
      <div class="field-label">Optional</div>
      <input class="input" type="password" id="deeplKey" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx" aria-label="DeepL API key" />
      <div class="field-sub">A free key ends with <strong style="color:var(--text)">:fx</strong>. Get one at <a href="#" onclick="window.chatpro.openUrl('https://www.deepl.com/pro-api')">deepl.com/pro-api</a></div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Clipboard</h2>
    <div class="toggle-row">
      <span class="toggle-label">Automatically detect messages</span>
      <div class="toggle" id="autoDetectToggle" onclick="toggleAutoDetect()"></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Automatically switch language (DE/ES/IT)</span>
      <div class="toggle" id="autoLangSwitchToggle" onclick="toggleAutoLangSwitch()"></div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Hotkey</h2>
    <div class="field">
      <div class="field-label">Open overlay shortcut</div>
      <input class="input" id="hotkey" placeholder="CommandOrControl+Shift+T" />
    </div>
  </div>

  <button class="btn-save" onclick="saveSettings()">Save settings</button>
  <div class="save-msg" id="saveMsg">Saved</div>
  <div class="version" id="versionLabel"></div>
</div>

<script>
let autoDetect = true;
let autoLangSwitch = true;

async function init() {
  try {
    var s = await window.chatpro.getSettings();
    document.getElementById('apiKey').value = s.apiKey || '';
    document.getElementById('deeplKey').value = s.deeplKey || '';
    document.getElementById('hotkey').value = s.hotkey || 'CommandOrControl+Shift+T';
    autoDetect = s.autoDetect !== false;
    autoLangSwitch = s.autoLangSwitch !== false;
    updateToggle();
    if (s.version) document.getElementById('versionLabel').textContent = 'v' + s.version;
  } catch(e) { console.error('settings init error:', e); }
}
init();

function toggleAutoDetect() {
  autoDetect = !autoDetect;
  updateToggle();
}
function toggleAutoLangSwitch() {
  autoLangSwitch = !autoLangSwitch;
  updateToggle();
}
function updateToggle() {
  document.getElementById('autoDetectToggle').classList.toggle('on', autoDetect);
  document.getElementById('autoLangSwitchToggle').classList.toggle('on', autoLangSwitch);
}

async function saveSettings() {
  // Strip non-printable-ASCII (zero-width spaces, smart quotes from copy-paste) —
  // HTTP headers are Latin-1 only, a stray Unicode char crashes fetch on x-api-key
  var apiKey = document.getElementById('apiKey').value.replace(/[^\x21-\x7E]/g, '');
  var deeplKey = document.getElementById('deeplKey').value.trim();
  var hotkey = document.getElementById('hotkey').value.trim() || 'CommandOrControl+Shift+T';
  await window.chatpro.saveSettings({ apiKey: apiKey, deeplKey: deeplKey, hotkey: hotkey, autoDetect: autoDetect, autoLangSwitch: autoLangSwitch });
  var msg = document.getElementById('saveMsg');
  msg.style.display = 'block';
  setTimeout(function() { msg.style.display = 'none'; }, 2000);
}
</script>
</body>
</html>
