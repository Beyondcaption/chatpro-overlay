<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.anthropic.com https://api.deepl.com https://api-free.deepl.com https://fonts.googleapis.com https://fonts.gstatic.com;">
<title>ChatPro</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#111114; --s1:#161619; --s2:#1e1e23; --s3:#252530; --b1:#2e2e38; --b2:#3d3d4a;
  --t1:#f0f0f5; --t2:#9898b0; --t3:#55556a; --t4:#33333f;
  --pink:#ff4d8f; --pink-dim:rgba(255,77,143,0.12);
  --gold:#ffb547; --gold-dim:rgba(255,181,71,0.1);
  --green:#3dd68c; --green-dim:rgba(61,214,140,0.1);
  --blue:#5b8ef0; --red:#ff5252; --purple:#b47aff;
  --r:10px; --r-sm:6px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; font-family:'Instrument Sans',sans-serif; background:var(--bg); color:var(--t1); font-size:13px; overflow:hidden; }

.titlebar { -webkit-app-region:drag; height:36px; background:var(--s1); border-bottom:1px solid var(--b1); display:flex; align-items:center; justify-content:space-between; padding:0 12px; flex-shrink:0; }
.tb-left { display:flex; align-items:center; gap:8px; pointer-events:none; }
.tb-logo { font-size:12px; font-weight:700; color:var(--t2); }
.tb-hotkey { font-size:10px; color:var(--t4); font-family:'JetBrains Mono',monospace; background:var(--s2); border:1px solid var(--b1); border-radius:4px; padding:2px 7px; }
.tb-right { display:flex; align-items:center; gap:6px; -webkit-app-region:no-drag; }
.tb-lang-badge { font-size:11px; font-weight:700; color:var(--pink); background:var(--pink-dim); border:1px solid rgba(255,77,143,0.3); border-radius:4px; padding:3px 8px; letter-spacing:0.03em; transition:background 0.2s,box-shadow 0.2s; }
.tb-lang-badge.flash { animation:flash-lang 1.4s ease; }
@keyframes flash-lang { 0%,100% { box-shadow:none; } 30% { box-shadow:0 0 0 3px rgba(255,77,143,0.35); } }
.tb-btn { background:none; border:none; color:var(--t3); cursor:pointer; font-size:14px; padding:2px 5px; border-radius:4px; }
.tb-btn:hover { color:var(--t1); background:var(--s2); }
.tb-btn.close:hover { color:var(--red); }

.body { display:flex; flex-direction:column; height:calc(100% - 36px); overflow:hidden; }

.input-section { padding:12px 14px; border-bottom:1px solid var(--b1); flex-shrink:0; }
.field-label { font-size:9px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--t3); margin-bottom:5px; display:flex; align-items:center; justify-content:space-between; }
.de-input { width:100%; background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm) var(--r-sm) 0 0; color:var(--t1); font-family:'Instrument Sans',sans-serif; font-size:12px; padding:8px 10px; outline:none; resize:none; min-height:48px; max-height:80px; overflow-y:auto; line-height:1.55; }
.de-input:focus { border-color:var(--b2); }
.de-input::placeholder { color:var(--t3); }

.de-translation { background:var(--s3); border:1px solid var(--b1); border-top:none; border-radius:0 0 var(--r-sm) var(--r-sm); padding:6px 10px; display:none; margin-bottom:2px; }
.de-translation.visible { display:block; }
.de-translation-label { font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--t4); margin-bottom:3px; }
.de-translation-text { font-size:11px; color:var(--t2); font-style:italic; line-height:1.5; }

.divider-row { display:flex; align-items:center; gap:8px; margin:8px 0; }
.divider-line { flex:1; height:1px; background:var(--b1); }
.divider-text { font-size:9px; color:var(--t4); letter-spacing:0.06em; white-space:nowrap; }

.en-input { width:100%; background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t1); font-family:'Instrument Sans',sans-serif; font-size:12px; padding:8px 10px; outline:none; resize:none; min-height:48px; max-height:80px; overflow-y:auto; line-height:1.55; }
.en-input:focus { border-color:var(--pink); box-shadow:0 0 0 2px var(--pink-dim); }
.en-input::placeholder { color:var(--t3); }

.action-row { display:flex; gap:6px; margin-top:8px; align-items:center; }
.btn-mood { background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t2); font-size:11px; padding:8px 10px; cursor:pointer; white-space:nowrap; }
.btn-mood:hover { border-color:var(--b2); }
.btn-gen { flex:1; background:linear-gradient(135deg,var(--pink),#ff8c69); border:none; border-radius:var(--r-sm); color:white; font-family:'Instrument Sans',sans-serif; font-size:12px; font-weight:600; padding:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-gen:hover:not(:disabled) { opacity:0.88; }
.btn-gen:disabled { opacity:0.4; cursor:not-allowed; }
.btn-yapper { background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t2); font-size:11px; padding:8px 10px; cursor:pointer; white-space:nowrap; transition:all 0.15s; font-family:'Instrument Sans',sans-serif; }
.btn-yapper:hover { border-color:var(--pink); color:var(--pink); }
.btn-yapper.active { background:rgba(255,77,143,0.14); border-color:var(--pink); color:var(--pink); font-weight:700; box-shadow:0 0 8px rgba(255,77,143,0.2); }
.profile-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.profile-select { flex:1; background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t1); font-family:'Instrument Sans',sans-serif; font-size:11px; padding:6px 8px; outline:none; cursor:pointer; }
.profile-select:focus { border-color:var(--pink); }
.profile-select option { background:#1e1e23; }
.profile-dot { width:7px; height:7px; border-radius:50%; background:var(--t4); flex-shrink:0; transition:background 0.2s; }
.profile-dot.active { background:var(--green); }

.lang-row { display:flex; gap:5px; margin-bottom:8px; }
.lang-pill { flex:1; background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t2); font-size:11px; font-weight:600; padding:6px 4px; cursor:pointer; font-family:'Instrument Sans',sans-serif; text-align:center; transition:background 0.15s,border-color 0.15s,color 0.15s; }
.lang-pill:hover { border-color:var(--b2); }
.lang-pill.active { background:rgba(255,77,143,0.14); border-color:var(--pink); color:var(--pink); }
.lang-pill.armed { background:var(--gold-dim); border-color:var(--gold); color:var(--gold); animation:pulse-armed 0.9s infinite; }
@keyframes pulse-armed { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

.goal-label { font-size:9px; color:var(--t4); letter-spacing:0.08em; text-transform:uppercase; margin-top:8px; margin-bottom:4px; }
.goals-row { display:flex; gap:5px; flex-wrap:wrap; }
.goal-btn { background:var(--s2); border:1px solid var(--b1); border-radius:20px; color:var(--t3); font-size:10px; padding:4px 11px; cursor:pointer; font-family:'Instrument Sans',sans-serif; white-space:nowrap; }
.goal-btn:hover { border-color:var(--b2); color:var(--t2); }
.goal-btn.active-engage  { background:rgba(91,142,240,0.1);  border-color:var(--blue);   color:var(--blue);   }
.goal-btn.active-sell    { background:rgba(255,181,71,0.1);  border-color:var(--gold);   color:var(--gold);   }
.goal-btn.active-tease   { background:rgba(255,77,143,0.1);  border-color:var(--pink);   color:var(--pink);   }
.goal-btn.active-comfort { background:rgba(61,214,140,0.1);  border-color:var(--green);  color:var(--green);  }
.goal-btn.active-renew   { background:rgba(180,122,255,0.1); border-color:var(--purple); color:var(--purple); }

.templates-strip { padding:8px 14px; border-bottom:1px solid var(--b1); flex-shrink:0; }
.tpl-scroll { display:flex; gap:5px; overflow-x:auto; padding-bottom:2px; }
.tpl-scroll::-webkit-scrollbar { height:2px; }
.tpl-chip { background:var(--s2); border:1px solid var(--b1); border-radius:20px; padding:4px 10px; font-size:10px; color:var(--t2); cursor:pointer; white-space:nowrap; }
.tpl-chip:hover { border-color:var(--pink); color:var(--pink); }

.mood-banner { margin:10px 14px 0; border-radius:var(--r-sm); padding:9px 11px; font-size:11px; line-height:1.55; display:none; }
.mood-banner.visible { display:block; }
.mood-label { font-size:9px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:3px; }
.mood-suggestion { font-weight:500; margin-top:4px; }
.mood-banner.hot    { background:rgba(255,77,143,0.08);  border:1px solid rgba(255,77,143,0.2); }
.mood-banner.hot    .mood-label { color:var(--pink); }
.mood-banner.warm   { background:rgba(255,181,71,0.08);  border:1px solid rgba(255,181,71,0.2); }
.mood-banner.warm   .mood-label { color:var(--gold); }
.mood-banner.cold   { background:rgba(91,142,240,0.08);  border:1px solid rgba(91,142,240,0.2); }
.mood-banner.cold   .mood-label { color:var(--blue); }
.mood-banner.angry  { background:rgba(255,82,82,0.08);   border:1px solid rgba(255,82,82,0.2); }
.mood-banner.angry  .mood-label { color:var(--red); }

.results-scroll { flex:1; overflow-y:auto; padding:10px 14px 14px; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--t4); text-align:center; gap:8px; }
.empty-icon { font-size:28px; opacity:0.3; }
.empty-text { font-size:11px; line-height:1.6; }

.reply-card { background:var(--s1); border:1px solid var(--b1); border-radius:var(--r); padding:11px 13px; margin-bottom:8px; animation:fadeup 0.25s ease both; }
.reply-card:hover { border-color:var(--b2); }
.reply-card:nth-child(1){animation-delay:0.04s;} .reply-card:nth-child(2){animation-delay:0.08s;} .reply-card:nth-child(3){animation-delay:0.12s;}
@keyframes fadeup { from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;} }
.rc-top { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.rc-label { font-size:9px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; }
.rc-label.l0{color:var(--pink);} .rc-label.l1{color:var(--purple);} .rc-label.l2{color:var(--gold);}
.rc-vibe { font-size:10px; color:var(--t3); font-style:italic; flex:1; }
.rc-score { font-size:10px; font-family:'JetBrains Mono',monospace; font-weight:500; }
.rc-de { font-size:13px; line-height:1.6; color:var(--t1); margin-bottom:7px; }
.rc-bubbles { margin-bottom:7px; }
.rc-bubble { background:var(--s2); border-radius:var(--r-sm); padding:7px 10px; margin-bottom:4px; font-size:13px; line-height:1.6; color:var(--t1); border-left:2px solid var(--pink); }
.rc-bubble:last-child { margin-bottom:0; }
.rc-bt { background:var(--s2); border-radius:var(--r-sm); padding:6px 9px; margin-bottom:8px; }
.rc-bt-label { font-size:8px; text-transform:uppercase; letter-spacing:0.1em; color:var(--t4); margin-bottom:2px; }
.rc-bt-text { font-size:11px; color:var(--t3); font-style:italic; line-height:1.5; }
.rc-actions { display:flex; gap:5px; align-items:center; }
.btn-use { background:var(--pink-dim); border:1px solid rgba(255,77,143,0.25); border-radius:var(--r-sm); color:var(--pink); font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; padding:5px 12px; cursor:pointer; }
.btn-use:hover { background:rgba(255,77,143,0.2); }
.btn-use.done { background:var(--green-dim); border-color:rgba(61,214,140,0.25); color:var(--green); }
.btn-sm { background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t3); font-size:10px; padding:5px 9px; cursor:pointer; font-family:'JetBrains Mono',monospace; }
.btn-sm:hover { color:var(--t1); border-color:var(--b2); }
.btn-sm.ok { color:var(--green); border-color:rgba(61,214,140,0.3); }

.spinner { width:12px; height:12px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.6s linear infinite; }
@keyframes spin{to{transform:rotate(360deg);}}

.history-panel { position:absolute; top:36px; left:0; right:0; bottom:0; background:var(--bg); z-index:100; display:none; flex-direction:column; }
.history-panel.visible { display:flex; }
.history-header { padding:10px 14px; border-bottom:1px solid var(--b1); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.history-title { font-size:11px; font-weight:600; color:var(--t2); }
.history-actions { display:flex; gap:6px; }
.history-list { flex:1; overflow-y:auto; padding:8px 14px; }
.history-item { background:var(--s1); border:1px solid var(--b1); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:6px; }
.history-time { font-size:9px; color:var(--t4); font-family:'JetBrains Mono',monospace; margin-bottom:5px; }
.history-de-in { font-size:11px; color:var(--t3); margin-bottom:3px; }
.history-reply { font-size:12px; color:var(--t1); margin-bottom:6px; line-height:1.5; }
.history-meta { display:flex; gap:8px; }
.history-tag { font-size:9px; background:var(--s2); border:1px solid var(--b1); border-radius:10px; padding:2px 7px; color:var(--t3); }
.btn-hist-dl { background:var(--green-dim); border:1px solid rgba(61,214,140,0.3); border-radius:var(--r-sm); color:var(--green); font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; padding:5px 10px; cursor:pointer; }
.btn-hist-dl:hover { background:rgba(61,214,140,0.2); }
.btn-hist-clr { background:var(--s2); border:1px solid var(--b1); border-radius:var(--r-sm); color:var(--t3); font-family:'Instrument Sans',sans-serif; font-size:10px; padding:5px 10px; cursor:pointer; }
.btn-hist-clr:hover { color:var(--red); border-color:rgba(255,82,82,0.3); }
::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
</style>
</head>
<body>

<div class="titlebar">
  <div class="tb-left">
    <span class="tb-logo">💬 ChatPro</span>
    <span class="tb-hotkey" id="hotkeyLabel">Ctrl+Shift+T</span>
  </div>
  <div class="tb-right">
    <span class="tb-lang-badge" id="tbLangBadge" title="Active language">DE</span>
    <button class="tb-btn" title="Translation History" onclick="toggleHistory()">🕘</button>
    <button class="tb-btn" title="Training" onclick="window.chatpro.openSchulung()">📚</button>
    <button class="tb-btn" onclick="window.chatpro.openSettings()">⚙</button>
    <button class="tb-btn close" onclick="window.chatpro.closeOverlay()">✕</button>
  </div>
</div>

<div style="position:relative;height:calc(100% - 36px);">
<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <span class="history-title">🕘 Translation History</span>
    <div class="history-actions">
      <button class="btn-hist-dl" onclick="downloadHistory()">⬇ Download JSON</button>
      <button class="btn-hist-clr" onclick="clearHistory()">Clear</button>
      <button class="btn-hist-clr" onclick="toggleHistory()">✕</button>
    </div>
  </div>
  <div class="history-list" id="historyList"></div>
</div>
<div class="body" style="height:100%;">
  <div class="input-section">
    <div class="lang-row" id="langRow">
      <button class="lang-pill" id="lang-de" onclick="clickLangPill('de')" title="Deutsch">🇩🇪 DE</button>
      <button class="lang-pill" id="lang-es" onclick="clickLangPill('es')" title="Español">🇲🇽 ES</button>
      <button class="lang-pill" id="lang-it" onclick="clickLangPill('it')" title="Italiano">🇮🇹 IT</button>
    </div>
    <div class="profile-row">
      <div class="profile-dot" id="profileDot"></div>
      <select class="profile-select" id="profileSelect" onchange="selectProfile(this.value)">
        <option value="">— Select Creator Profile —</option>
      </select>
      <button class="tb-btn" id="sheetBtn" onclick="openSheet()" title="Model Sheet" style="display:none;font-size:12px;padding:4px 7px;flex-shrink:0;">ℹ️</button>
    </div>
    <div class="field-label">
      <span id="fieldLabelText">German message from subscriber</span>
      <span style="font-size:9px;color:var(--t4);" id="autoLabel"></span>
    </div>
    <textarea class="de-input" id="deInput" rows="2"
      placeholder="Paste German message here…"
      oninput="autosize(this); scheduleTranslate()"
      onpaste="setTimeout(function(){scheduleTranslate();}, 100)"></textarea>
    <div class="de-translation" id="deTranslation">
      <div class="de-translation-label">↩ Means in English</div>
      <div class="de-translation-text" id="deTranslationText"></div>
    </div>

    <div class="divider-row">
      <div class="divider-line"></div>
      <div class="divider-text">your reply in English</div>
      <div class="divider-line"></div>
    </div>

    <textarea class="en-input" id="enInput" rows="2"
      placeholder="What you want to say… (or pick template below)"
      oninput="autosize(this)">
    </textarea>

    <div class="action-row">
      <button class="btn-mood" id="moodBtn" onclick="analyzeMood()">🔍</button>
      <button class="btn-yapper" id="yapperBtn" onclick="toggleYapper()" title="Yapper Mode">⚡ Yapper</button>
      <button class="btn-gen" id="genBtn" onclick="generateReplies()">
        <span id="genBtnText">⚡ Generate</span>
      </button>
    </div>

    <div class="goal-label">Goal <span style="font-style:italic;">(optional)</span></div>
    <div class="goals-row">
      <button class="goal-btn" id="g-engage"  onclick="setGoal('engage')">💬 Keep Engaged</button>
      <button class="goal-btn" id="g-sell"    onclick="setGoal('sell')">💰 Sell PPV</button>
      <button class="goal-btn" id="g-tease"   onclick="setGoal('tease')">🔥 Tease Content</button>
      <button class="goal-btn" id="g-comfort" onclick="setGoal('comfort')">💙 Build Bond</button>
      <button class="goal-btn" id="g-renew"   onclick="setGoal('renew')">♻️ Secure Renewal</button>
    </div>
  </div>

  <div class="templates-strip">
    <div class="tpl-scroll" id="tplScroll"></div>
  </div>

  <div class="mood-banner" id="moodBanner">
    <div class="mood-label" id="moodLabel">Mood</div>
    <div id="moodText" style="color:var(--t2);font-size:11px;"></div>
    <div id="moodSuggestion" style="font-weight:500;margin-top:4px;font-size:11px;"></div>
  </div>

  <div class="results-scroll" id="resultsScroll">
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div class="empty-text" id="emptyStateText">Paste the German message<br>and your English reply,<br>then hit ⚡ Generate</div>
    </div>
  </div>
</div>
</div>

<script>
// ── State ──
let apiKey   = '';
let deeplKey = '13d024f8-13bc-45cb-b60b-b4e8988492c0';
let activeGoal = null;
let yapperMode = false;
let creatorProfiles = [];
var learnedRules = '';
let selectedProfile = null;
let lastDeText = '';
let currentUtterance = null;
let lastMood = null;
const ttsOk = 'speechSynthesis' in window;

const TEMPLATES = [
  {en:"You made me smile 😊",            label:"😊 Smile"},
  {en:"I've been thinking about you…",   label:"💭 Thinking"},
  {en:"I saved something just for you",  label:"🎁 Special"},
  {en:"Want a sneak peek of my new content?", label:"👀 Peek"},
  {en:"Thank you for always being here", label:"💙 Thanks"},
  {en:"You're one of my favourites",     label:"⭐ Fav"},
  {en:"Hey, I missed you!",              label:"✨ Missed"},
  {en:"I have something exclusive for loyal fans", label:"💎 Exclusive"},
];

const GOAL_PROMPTS = {
  engage:  'GOAL: Keep him engaged — make him want to reply. Ask a question, be curious and warm. Do NOT sell anything.',
  sell:    'GOAL: Sell PPV — naturally lead towards paid content. Tease something exciting. Make him curious to pay. Be subtle not pushy.',
  tease:   'GOAL: Tease content — hint at exclusive content, create desire. Leave him wanting more.',
  comfort: 'GOAL: Build bond — be warm, personal, emotional. Make him feel special and connected.',
  renew:   'GOAL: Secure renewal — remind him what he loves about the subscription. Create FOMO about upcoming content.',
};

// ── Languages ──
// Each entry drives the persona prompt, the mood-analysis prompt, TTS voice and
// the UI copy (via nameEn) for that fan-message language. currentLang is the
// single source of truth — never derive language from anything else at runtime.
let currentLang = 'de';

const LANGUAGES = {
  de: {

async function init() {
  // Register IPC listeners first — before any await so events are never missed
  window.chatpro.onAutoSwitchLanguage(function(code) {
    // Fired by main.js right before set-de-text when the clipboard watcher
    // detected a clear, multi-signal language switch. applyLanguage() clears
    // the input/results (same as a manual switch) — the incoming set-de-text
    // that follows immediately after fills it back in with the new message.
    applyLanguage(code);
  });
  window.chatpro.onSetDeText(function(text) {
    var el = document.getElementById('deInput');
    el.value = text;
    autosize(el);
    var lbl = document.getElementById('autoLabel');
    lbl.textContent = '← auto-detected';
    setTimeout(function() { lbl.textContent = ''; }, 2000);
    document.getElementById('enInput').focus();
    flashLangBadge();
    scheduleTranslate();
  });
  window.chatpro.onOverlayShown(function() {
    activeGoal = null;
    document.querySelectorAll('.goal-btn').forEach(function(b) { b.className = 'goal-btn'; });
    document.getElementById('moodBanner').className = 'mood-banner';
    lastMood = null;
  });

  try {
    var settings = await window.chatpro.getSettings();
    apiKey   = settings.apiKey   || '';
    deeplKey = deeplKey || settings.deeplKey || '';
    currentLang = LANGUAGES[settings.language] ? settings.language : 'de';
    var hk = (settings.hotkey || 'CommandOrControl+Shift+T')
      .replace('CommandOrControl', 'Ctrl').replace('Command', 'Cmd');
    document.getElementById('hotkeyLabel').textContent = hk;
  } catch(e) {}

  try { yapperMode = localStorage.getItem('yapperMode') === 'true'; } catch(e) {}

    var yb = document.getElementById('yapperBtn');

  var btn = document.getElementById('sheetBtn');
  btn.style.display = (selectedProfile && selectedProfile.sheet_data) ? 'block' : 'none';
}

// ── Language switcher (arm-and-confirm — guards against an accidental click
// switching the active language mid-shift) ──
var armedLang = null;
var armTimer = null;

function renderLangPills() {
  ['de', 'es', 'it'].forEach(function(code) {
    var btn = document.getElementById('lang-' + code);
    if (!btn) return;
    btn.classList.toggle('active', code === currentLang && armedLang !== code);
    btn.classList.toggle('armed', armedLang === code);
  });
}

function clickLangPill(code) {
  if (code === currentLang && armedLang !== code) return; // already active — no-op
  if (armedLang === code) {
    // Second click on the same pill within the window — confirmed, apply it.
    clearTimeout(armTimer);
    armedLang = null;
    applyLanguage(code);
    return;
  }
  // First click — arm only, do not switch yet. Clicking elsewhere or letting
  // this expire cancels; only a deliberate second click on the same pill commits.
  armedLang = code;
  renderLangPills();
  clearTimeout(armTimer);
  armTimer = setTimeout(function() { armedLang = null; renderLangPills(); }, 3000);
}

function applyLangUI() {
  var L = LANGUAGES[currentLang];
  var lbl = document.getElementById('fieldLabelText');
  if (lbl) lbl.textContent = L.nameEn + ' message from subscriber';
  var input = document.getElementById('deInput');
  if (input) input.placeholder = 'Paste ' + L.nameEn + ' message here…';
  var empty = document.getElementById('emptyStateText');
  if (empty) empty.innerHTML = 'Paste the ' + L.nameEn + ' message<br>and your English reply,<br>then hit ⚡ Generate';
  var badge = document.getElementById('tbLangBadge');
  if (badge) badge.textContent = L.flag + ' ' + L.pillLabel;
  renderLangPills();
}

// Briefly highlights the title-bar language badge so a chatter glancing at
// the top-right corner immediately confirms which language just came in,
// without having to look down at the lang-pill row.
function flashLangBadge() {
  var badge = document.getElementById('tbLangBadge');
  if (!badge) return;
  badge.classList.remove('flash');
  void badge.offsetWidth; // restart animation if it's already mid-flash
  badge.classList.add('flash');
}

function applyLanguage(code) {
  if (!LANGUAGES[code] || code === currentLang) return;
  currentLang = code;
  try { window.chatpro.saveSettings({ language: code }); } catch(e) {}

  // Never carry stale input/mood/results across a language switch — that mix
  // is exactly the accidental-wrong-language failure mode this guards against.
  clearTimeout(translateTimer);
  document.getElementById('deInput').value = '';
  document.getElementById('enInput').value = '';
  document.getElementById('deTranslation').classList.remove('visible');
  document.getElementById('moodBanner').className = 'mood-banner';
  lastMood = null;
  activeGoal = null;
  document.querySelectorAll('.goal-btn').forEach(function(b) { b.className = 'goal-btn'; });
  document.getElementById('resultsScroll').innerHTML =
    '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text" id="emptyStateText"></div></div>';

  applyLangUI();
}

  var box = document.getElementById('deTranslation');

  box.classList.add('visible');
  txt.textContent = '...';
  try {
    // Via IPC through main process — bypasses CORS restrictions in Electron
    var result = await window.chatpro.deeplTranslate({ text: text, key: deeplKey, lang: currentLang });

    var d = JSON.parse(raw.replace(/```json|```/g, '').trim());
    lastMood = d;
    var b = document.getElementById('moodBanner');
    b.className = 'mood-banner visible ' + d.mood;
    document.getElementById('moodLabel').textContent = '🔍 ' + (d.moodLabel || 'Mood');
    document.getElementById('moodText').textContent = d.analysis || '';
    document.getElementById('moodSuggestion').textContent = '→ ' + (d.suggestion || '');
  } catch(e) {}
  btn.textContent = '🔍'; btn.disabled = false;
}

// ── Generate ──
async function generateReplies() {
  var de = document.getElementById('deInput').value.trim();
  var en = document.getElementById('enInput').value.trim();
  if (!de || !en) {
    if (!de) document.getElementById('deInput').focus();
    else document.getElementById('enInput').focus();
    return;
  }
  if (!apiKey) apiKey = await window.chatpro.getApiKey();
  if (!apiKey) { window.chatpro.openSettings(); return; }

  clearTimeout(translateTimer); // cancel any pending DeepL update while viewing results
  lastDeText = de;
  var btn = document.getElementById('genBtn');
  var txt = document.getElementById('genBtnText');
  btn.disabled = true;
  txt.innerHTML = '<div class="spinner"></div>';

  var goalCtx = activeGoal ? '\n\nCONVERSATION GOAL:\n' + GOAL_PROMPTS[activeGoal] : '';

  var profileCtx = '';
  if (selectedProfile) {
    var sd = selectedProfile.sheet_data || {};
    profileCtx = '\n\nCREATOR PROFILE — THIS IS EXACTLY WHO YOU ARE:\n' +
      'Name: ' + (selectedProfile.name || '') + '\n' +
      (selectedProfile.age ? 'Age: ' + selectedProfile.age + '\n' : '') +
      (selectedProfile.personality ? 'Personality: ' + selectedProfile.personality + '\n' : '') +
      (selectedProfile.interests ? 'Interests & Hobbies: ' + selectedProfile.interests + '\n' : '') +
      (selectedProfile.preferences ? 'Likes & Preferences: ' + selectedProfile.preferences + '\n' : '') +
      (selectedProfile.style ? 'Communication Style: ' + selectedProfile.style + '\n' : '') +
      (selectedProfile.avoid_topics ? 'NEVER mention: ' + selectedProfile.avoid_topics + '\n' : '') +
      (sd.general ? '\n[General Info]\n' + sd.general + '\n' : '') +
      (sd.background ? '\n[Background & Story]\n' + sd.background + '\n' : '') +
      (sd.favorites ? '\n[Her Favorites — use naturally in conversation]\n' + sd.favorites + '\n' : '') +
      (sd.personality ? '\n[Deep Personality]\n' + sd.personality + '\n' : '') +
      '\nLet her personality shape every word you write.';
  }

  var yapperExtra = yapperMode
    ? '\n\nYAPPER MODE — MULTIPLE SHORT MESSAGES:\n- Split the reply into 2-4 separate messages — how she\'d actually send them one by one\n- Each message max 1 short sentence or fragment. Punch, send, punch, send.\n- Full feminine Yapper energy: excited, warm, alive, giggly\n- Elongated words sparingly — roughly 1 in 4 messages, ONLY when the excitement is genuinely real. Not every message, not every burst. Options when it fits: "waaaas", "hahahaha", "soooo", "neeein", "omgggg", "süüüß", "nööö", "ahhh", "öhm"\n- Feminine-leaning slang only: "voll", "mega", "krass", "ohje", "ach", "hihi", "oh mann" — NEVER "digga", "alter", "bruder", "ey mann"\n- Feminine emojis 🥺 🙈 🫶 🥹 😚 🤭 — 1-2 per message, stacked when energy demands it\n- Last message almost always ends with a question or tease\n- The messages array in JSON replaces the de field — see format below'
    : '';

  var moodCtx = lastMood
    ? '\n\nMOOD READ (from analysis): Subscriber is "' + lastMood.mood + '" — ' + (lastMood.analysis || '') + '. Let this shape your tone.'
    : '';

  var systemBase = LANGUAGES[currentLang].systemBase;

  // Prompt caching: the large static persona prompt is identical on every call,
  // so cache it (90% cheaper on hits). Dynamic context goes in a second, uncached block.
  var systemExtra = profileCtx + yapperExtra + moodCtx + goalCtx;
  // learnedRules come from chatpro-ops training data tuned on German chat — never
  // apply them outside German, they'd contaminate ES/IT tone with the wrong corrections.
  var systemBaseWithRules = (learnedRules && currentLang === 'de') ? (systemBase + '\n\n' + learnedRules) : systemBase;
  var systemBlocks = [{ type: 'text', text: systemBaseWithRules, cache_control: { type: 'ephemeral' } }];
  if (systemExtra) systemBlocks.push({ type: 'text', text: systemExtra });

  var langName = LANGUAGES[currentLang].nameEn;
  var user = yapperMode
    ? 'He wrote (' + langName + '): "' + de + '"\n\nYour reply intent (English): "' + en + '"\n\nSplit into 2-4 short messages as she\'d send them one by one. Same meaning. Write 3 variants. Return ONLY valid JSON:\n{"variants":[{"label":"...","vibe":"one-line vibe","messages":["msg1","msg2","msg3"],"bt":"English back-translation","score":92},{"label":"...","vibe":"...","messages":["msg1","msg2"],"bt":"...","score":88},{"label":"...","vibe":"...","messages":["msg1","msg2","msg3"],"bt":"...","score":85}]}'
    : 'He wrote (' + langName + '): "' + de + '"\n\nYour reply intent (English — preserve this EXACTLY): "' + en + '"\n\nSay the same thing in your natural voice. Same meaning, same direction — never flip who is doing/wanting what. Write 3 variants with genuinely different tone/energy. Choose labels that fit THIS exchange. Return ONLY valid JSON:\n{"variants":[{"label":"...","vibe":"one-line vibe","de":"' + langName + ' reply","bt":"English back-translation","score":92},{"label":"...","vibe":"one-line vibe","de":"' + langName + ' reply","bt":"English back-translation","score":88},{"label":"...","vibe":"one-line vibe","de":"' + langName + ' reply","bt":"English back-translation","score":85}]}';

  try {
    var raw = await callClaude(systemBlocks, user, 'claude-sonnet-5');
    var d;
    try {
      var jsonStr = raw.replace(/```json|```/g, '').trim();
      // Sonnet 5 occasionally prepends reasoning before the JSON.
      // Extract the outermost {...} so any preamble/suffix never breaks the parse.
      var jStart = jsonStr.indexOf('{'), jEnd = jsonStr.lastIndexOf('}');
      if (jStart !== -1 && jEnd !== -1 && jEnd > jStart) jsonStr = jsonStr.slice(jStart, jEnd + 1);
      d = JSON.parse(jsonStr);
    } catch(pe) { throw new Error('bad_response'); }
    if (!d || !Array.isArray(d.variants) || !d.variants.length) throw new Error('bad_response');
    renderReplies(d.variants);
    activeGoal = null;
    document.querySelectorAll('.goal-btn').forEach(function(b) { b.className = 'goal-btn'; });
  } catch(e) {
    var msg = e.message === 'invalid_key'
      ? '❌ Wrong API Key — open Settings ⚙ and check your Anthropic key.'
      : e.message === 'overloaded'
      ? '⏳ Claude is currently overloaded. Wait a moment and try again.'
      : e.message === 'bad_response'
      ? '⚠️ Unexpected response from Claude. Try again.'
      : e.message === 'offline'
      ? '🌐 Cannot reach Claude — check your internet connection (direct and relay route both failed).'
      : 'Error: ' + escHtml(e.message);
    document.getElementById('resultsScroll').innerHTML = '<div style="padding:16px;color:#ff5252;font-size:12px;line-height:1.7;">' + msg + '</div>';
  }
  btn.disabled = false;
  txt.innerHTML = '⚡ Generate';
}

function scoreColor(s) {
  if (s >= 88) return 'var(--green)';
  if (s >= 78) return 'var(--gold)';
  return 'var(--blue)';
}

function cleanText(s) {
  return (s || '')
    .replace(/\u2014/g, '-').replace(/\u2013/g, '-')
    .replace(/\u2026/g, '...').replace(/[\u201C\u201D\u201E]/g, '"')
    .replace(/[\u2018\u2019]/g, "'").replace(/\u00A0/g, ' ')
    .replace(/[*_~`]/g, '');
}

function renderReplies(variants) {
  try {
    var colors = ['l0','l1','l2'];
    var html = variants.map(function(v, i) {
      var isYapper = Array.isArray(v.messages) && v.messages.length > 0;
      if (isYapper) v.messages = v.messages.map(cleanText);
      else v.de = cleanText(v.de);
      v.bt = cleanText(v.bt);
      v.vibe = cleanText(v.vibe);
      var allText = isYapper ? v.messages.join('\n') : (v.de || '');
      var st = allText.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
      var sc = v.score || 85;

      var bodyHtml = isYapper
        ? '<div class="rc-bubbles">' + v.messages.map(function(m) { return '<div class="rc-bubble">' + escHtml(m) + '</div>'; }).join('') + '</div>'
        : '<div class="rc-de">' + escHtml(v.de) + '</div>';

      var ttsBtn = (!isYapper && ttsOk) ? '<button class="btn-sm" onclick="playAudio(\`' + st + '\`)">▶</button>' : '';
      var useLabel = isYapper ? '✓ Copy All' : '✓ Copy & Use';

      return '<div class="reply-card">' +
        '<div class="rc-top">' +
          '<span class="rc-label ' + colors[i] + '">' + escHtml(v.label) + '</span>' +
          '<span class="rc-vibe">' + escHtml(v.vibe) + '</span>' +
          '<span class="rc-score" style="color:' + scoreColor(sc) + ';">' + sc + '%</span>' +
        '</div>' +
        bodyHtml +
        '<div class="rc-bt"><div class="rc-bt-label">↩ Means in English</div><div class="rc-bt-text">' + escHtml(v.bt) + '</div></div>' +
        '<div class="rc-actions">' +
          '<button class="btn-use" id="use' + i + '" onclick="useReply(' + i + ',\`' + st + '\`)">' + useLabel + '</button>' +
          '<button class="btn-sm" id="cp' + i + '" onclick="copyText(this,\`' + st + '\`)">Copy</button>' +
          ttsBtn +
        '</div>' +
      '</div>';
    }).join('');
    document.getElementById('resultsScroll').innerHTML = html;
  } catch(e) {
    document.getElementById('resultsScroll').innerHTML = '<div style="padding:16px;color:#ff5252;font-size:12px;">Failed to display results. Try again.</div>';
  }
}

async function useReply(i, text) {
  await window.chatpro.copyToClipboard(text);
  var btn = document.getElementById('use' + i);
  if (btn) { btn.textContent = '✓ Copied!'; btn.classList.add('done'); }

  // Attribute this reply to the logged-in chatter for QA (fire-and-forget).
  try { window.chatpro.reportChatter({ account: selectedProfile ? selectedProfile.name : '', text: text }); } catch(e) {}

  // Log to history
  var de = document.getElementById('deInput').value.trim();
  var en = document.getElementById('enInput').value.trim();
  try {
    await window.chatpro.logTranslation({
      germanInput: de,
      englishIntent: en,
      translatedReply: text,
      profile: selectedProfile ? selectedProfile.name : '',
      goal: activeGoal || ''
    });
  } catch(e) {}
}

// ── Audio ──
function playAudio(text) {
  if (!ttsOk) return;
  window.speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  var L = LANGUAGES[currentLang];
  utt.lang = L.ttsLang; utt.rate = 0.9;
  var voices = window.speechSynthesis.getVoices();
  var dv = voices.find(function(v) { return v.lang.startsWith(L.code); });
  if (dv) utt.voice = dv;
  window.speechSynthesis.speak(utt);
}
if (ttsOk) window.speechSynthesis.getVoices();

// ── Claude API ──
// Strip lone UTF-16 surrogates (half emojis) — a pasted fan message can carry a
// truncated emoji. JSON.stringify ships it as an unpaired \uXXXX and the API rejects
// the whole body ("no low surrogate in string"). Drop the broken half so Generate
// never crashes on bad input. Mirrors the Latin-1 key sanitization above.
function stripLoneSurrogates(s) {
  return String(s == null ? '' : s)
    .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, '')  // high not followed by low
    .replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, ''); // low not preceded by high
}

async function callClaude(system, userMsg, model, _retry) {
  // Sanitize: HTTP headers are Latin-1 only; strip any non-printable-ASCII char
  // (zero-width space, smart quotes) a copy-pasted key may carry, else fetch throws.
  // Re-read from the store on every call: a key saved in Settings must take effect
  // immediately, not only after an app restart (stale in-memory copy kept a renewed
  // key from working, 082326).
  var key = ((await window.chatpro.getApiKey()) || apiKey || '').replace(/[^\x21-\x7E]/g, '');
  apiKey = key;

  // Clean broken emojis out of every string that goes into the body.
  // system is a string (mood) or an array of {type,text,cache_control} blocks (generate).
  var safeUser = stripLoneSurrogates(userMsg);
  var safeSystem = Array.isArray(system)
    ? system.map(function(b) {
        return (b && typeof b.text === 'string')
          ? Object.assign({}, b, { text: stripLoneSurrogates(b.text) })
          : b;
      })
    : stripLoneSurrogates(system);

  // Adaptive thinking lifts reply quality on the Opus generate call (more natural,
  // in-character). Haiku (mood) does not support adaptive thinking, so gate it out.
  // When thinking is on, raise max_tokens so reasoning never crowds out the JSON reply
  // (max_tokens is a cap, not a charge -- only tokens actually produced are billed).
  var thinks = !/haiku/i.test(model || '');
  var maxTok = yapperMode ? 1800 : 1200;
  var body = {
    model: model || 'claude-sonnet-4-6',
    max_tokens: thinks ? maxTok + 4000 : maxTok,
    system: safeSystem,
    messages: [{ role: 'user', content: safeUser }]
  };
  if (thinks) body.thinking = { type: 'adaptive' };

  // Direct call first; if the network path to api.anthropic.com is blocked
  // (some ISPs do — surfaces as "Failed to fetch"), fall back to the Railway
  // relay, which forwards the request 1:1 including this key (082326 incident).
  var status, raw;
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
    status = res.status;
    raw = await res.text();
  } catch (netErr) {
    var relay = await window.chatpro.claudeRelay({ apiKey: key, body: body });
    if (!relay || !relay.ok) throw new Error('offline');
    status = relay.status;
    raw = relay.body;
  }

  // Overloaded — retry once after 3 seconds
  if (status === 529 || status === 503) {
    if (!_retry) {
      await new Promise(function(r) { setTimeout(r, 3000); });
      return callClaude(system, userMsg, model, true);
    }
    throw new Error('overloaded');
  }

  var data;
  try { data = JSON.parse(raw); }
  catch (pe) { throw new Error('bad_response'); }

  if (data.error) {
    var code = data.error.type || '';
    if (status === 401 || code === 'authentication_error') throw new Error('invalid_key');
    if (code === 'overloaded_error') {
      if (!_retry) {
        await new Promise(function(r) { setTimeout(r, 3000); });
        return callClaude(system, userMsg, model, true);
      }
      throw new Error('overloaded');
    }
    throw new Error(data.error.message);
  }

  return data.content.map(function(b) { return b.text || ''; }).join('');
}

// ── Utils ──
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 80) + 'px'; }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/'/g,"\\'"); }
function copyText(btn, text) {
  window.chatpro.copyToClipboard(text).then(function() {
    var orig = btn.textContent;
    btn.textContent = '✓'; btn.classList.add('ok');
    setTimeout(function() { btn.textContent = orig; btn.classList.remove('ok'); }, 1500);
  });
  try { window.chatpro.reportChatter({ account: selectedProfile ? selectedProfile.name : '', text: text }); } catch(e) {}
}
// ── History ──
var historyVisible = false;
async function toggleHistory() {
  historyVisible = !historyVisible;
  var panel = document.getElementById('historyPanel');
  panel.classList.toggle('visible', historyVisible);
  if (historyVisible) await renderHistory();
}

async function renderHistory() {
  var list = document.getElementById('historyList');
  var entries = await window.chatpro.getHistory();
  if (!entries.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--t4);font-size:11px;text-align:center;">No translations yet</div>';
    return;
  }
  list.innerHTML = entries.map(function(e) {
    var t = new Date(e.timestamp).toLocaleString('en-GB', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    return '<div class="history-item">' +
      '<div class="history-time">' + t + (e.profile ? ' · ' + escHtml(e.profile) : '') + '</div>' +
      '<div class="history-de-in">Fan: ' + escHtml(e.germanInput || '') + '</div>' +
      '<div class="history-reply">' + escHtml(e.translatedReply || '') + '</div>' +
      '<div class="history-meta">' +
        (e.goal ? '<span class="history-tag">' + escHtml(e.goal) + '</span>' : '') +
        '<span class="history-tag">EN: ' + escHtml((e.englishIntent || '').substring(0, 40)) + (e.englishIntent && e.englishIntent.length > 40 ? '…' : '') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function downloadHistory() {
  var entries = await window.chatpro.getHistory();
  var json = JSON.stringify(entries, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'chatpro-history-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function clearHistory() {
  if (!confirm('Clear all translation history?')) return;
  await window.chatpro.clearHistory();
  renderHistory();
}

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateReplies();
  if (e.key === 'Escape') window.chatpro.closeOverlay();
});
</script>
